<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fishslop</title>
    <meta name="description" content="Pilot a feeding submarine through a 3D aquarium. Grow guppies, collect their coins, and harpoon the monsters." />
    <meta name="theme-color" content="#0b5470" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Link previews (WhatsApp, Slack, Discord, X). Crawlers need absolute image URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fishslop" />
    <meta property="og:title" content="Fishslop" />
    <meta property="og:description" content="Pilot a feeding submarine through a 3D aquarium. Grow guppies, collect their coins, and harpoon the monsters." />
    <meta property="og:url" content="https://sergioahp.github.io/vibecoding/fishslop/" />
    <meta property="og:image" content="https://sergioahp.github.io/vibecoding/fishslop/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A yellow submarine harpooning a purple monster in an aquarium full of guppies and coins." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="hud" hidden>
      <div class="panel gauges">
        <div class="money"><span class="coin-icon" aria-hidden="true"></span><span id="money">0</span></div>
        <dl class="readouts">
          <div><dt data-i18n="hudFish">Fish</dt><dd id="fish-count">0</dd></div>
          <div><dt data-i18n="hudPellets">Pellets</dt><dd id="pellets">0/3</dd></div>
          <div class="depth"><dt data-i18n="hudDepth">Depth</dt><dd id="depth">0 m</dd></div>
        </dl>
      </div>

      <div class="panel goals">
        <div><dt data-i18n="hudEgg">Egg</dt><dd id="egg-pips" class="pips"></dd></div>
        <div><dt data-i18n="hudContact">Next contact</dt><dd id="contact">--:--</dd></div>
      </div>

      <div id="alert" hidden></div>
      <div id="toasts"></div>
      <div id="crosshair" aria-hidden="true"></div>
      <div id="labels"></div>

      <div id="touch" class="touch-only">
        <div id="stick" aria-hidden="true"><div id="stick-knob"></div></div>
        <button id="t-pause" type="button" class="t-btn" data-i18n-label="touchPause"><span aria-hidden="true">II</span></button>
        <button id="t-up" type="button" class="t-btn" data-i18n-label="touchUp"><span aria-hidden="true">▲</span></button>
        <button id="t-down" type="button" class="t-btn" data-i18n-label="touchDown"><span aria-hidden="true">▼</span></button>
        <button id="t-feed" type="button" class="t-btn" data-i18n="touchFeed">Feed</button>
        <button id="t-fire" type="button" class="t-btn" data-i18n="touchFire">Harpoon</button>
      </div>

      <div id="shop"></div>
      <p class="hints desktop-only" data-i18n-html="hints"></p>
    </div>

    <section id="overlay-title" class="overlay">
      <div class="card">
        <button id="lang" type="button" class="lang" data-i18n="otherLang" data-i18n-label="otherLangLabel">Español</button>
        <h1 class="logo">Fishslop</h1>
        <p class="tagline" data-i18n="tagline"></p>
        <ul class="howto">
          <li><b data-i18n="howFeedTitle">Feed</b><span data-i18n="howFeed"></span></li>
          <li><b data-i18n="howGrowTitle">Grow</b><span data-i18n="howGrow"></span></li>
          <li><b data-i18n="howCollectTitle">Collect</b><span data-i18n="howCollect"></span></li>
          <li><b data-i18n="howDefendTitle">Defend</b><span data-i18n="howDefend"></span></li>
          <li><b data-i18n="howWinTitle">Win</b><span data-i18n="howWin"></span></li>
        </ul>
        <button id="start" type="button" class="primary" data-i18n="start">Dive in</button>
        <p class="fine touch-only touch-help" data-i18n="touchHelp"></p>
        <p class="fine" data-i18n="credits"></p>
      </div>
    </section>

    <section id="overlay-pause" class="overlay" hidden>
      <div class="card small">
        <h2 data-i18n="paused">Paused</h2>
        <p data-i18n="pausedBody"></p>
        <button id="resume" type="button" class="primary" data-i18n="resume">Resume</button>
      </div>
    </section>

    <section id="overlay-end" class="overlay" hidden>
      <div class="card small">
        <h2 id="end-title"></h2>
        <p id="end-sub"></p>
        <dl id="end-stats" class="stats"></dl>
        <button id="restart" type="button" class="primary" data-i18n="restart">Play again</button>
      </div>
    </section>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
